[build]
  # `pnpm build` owns the build flags, so the memory the pages need is
  # raised in one place instead of drifting between here and package.json.
  command = "node scripts/ci/check-build-prereqs.mjs && pnpm build"
  publish = "doc_build"

# The version home is a directory-style URL, so redirect `/next` to `/next/`
# instead of serving the same page at two URLs. Netlify normalizes trailing
# slashes before evaluating redirect rules, so a static redirect would also
# match its target and cause a loop. Edge Functions run first and can inspect
# the original pathname. A release branch serves a second version home at its
# own base and registers it here alongside `/next`.
[[edge_functions]]
  function = "redirect-version-root"
  path = "/next"

[[headers]]
  for = "/*"
  [headers.values]
    access-control-allow-origin = "https://www.unpkg.com"

# contextBridge is documented under its public subpath, not the package root.
[[redirects]]
  from = "/lynxtron/api/@lynx-js/lynxtron/Variable.contextBridge*"
  to = "/lynxtron/api/@lynx-js/lynxtron/context-bridge/Variable.contextBridge.html"
  status = 301
  force = true

[[redirects]]
  from = "/zh/lynxtron/api/@lynx-js/lynxtron/Variable.contextBridge*"
  to = "/zh/lynxtron/api/@lynx-js/lynxtron/context-bridge/Variable.contextBridge.html"
  status = 301
  force = true

[[redirects]]
  from = "/next/lynxtron/api/@lynx-js/lynxtron/Variable.contextBridge*"
  to = "/next/lynxtron/api/@lynx-js/lynxtron/context-bridge/Variable.contextBridge.html"
  status = 301
  force = true

[[redirects]]
  from = "/next/zh/lynxtron/api/@lynx-js/lynxtron/Variable.contextBridge*"
  to = "/next/zh/lynxtron/api/@lynx-js/lynxtron/context-bridge/Variable.contextBridge.html"
  status = 301
  force = true

# Tutorials moved from /guide/start/tutorial-* to top-level /learn/*. The
# /next/* rewrite at the bottom doesn't chain into these — direct hits to
# the /next/ form need their own rules. The trailing splat catches the bare
# URL plus the .html and .md variants in one rule.
[[redirects]]
  from = "/guide/start/tutorial-gallery*"
  to = "/learn/gallery:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/guide/start/tutorial-gallery*"
  to = "/zh/learn/gallery:splat"
  status = 301
  force = true

[[redirects]]
  from = "/guide/start/tutorial-product-detail*"
  to = "/learn/product-detail:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/guide/start/tutorial-product-detail*"
  to = "/zh/learn/product-detail:splat"
  status = 301
  force = true

[[redirects]]
  from = "/next/guide/start/tutorial-gallery*"
  to = "/next/learn/gallery:splat"
  status = 301
  force = true

[[redirects]]
  from = "/next/zh/guide/start/tutorial-gallery*"
  to = "/next/zh/learn/gallery:splat"
  status = 301
  force = true

[[redirects]]
  from = "/next/guide/start/tutorial-product-detail*"
  to = "/next/learn/product-detail:splat"
  status = 301
  force = true

[[redirects]]
  from = "/next/zh/guide/start/tutorial-product-detail*"
  to = "/next/zh/learn/product-detail:splat"
  status = 301
  force = true

# Quick Start lived at /<subsite>/start/quick-start for every subsite while
# we had multiple shared docs (see shared-route-config.ts history). Today
# the canonical is /guide/start/quick-start; redirect historical alternates
# so bookmarks and crawler-cached URLs still resolve.
[[redirects]]
  from = "/ai/start/*"
  to = "/guide/start/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/ai/start/*"
  to = "/zh/guide/start/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/react/start/*"
  to = "/guide/start/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/react/start/*"
  to = "/zh/guide/start/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/rspeedy/*"
  to = "/api/build/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/api/rspeedy/*"
  to = "/zh/api/build/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/next/api/rspeedy/*"
  to = "/next/api/build/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/next/zh/api/rspeedy/*"
  to = "/next/zh/api/build/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/rspeedy/start/*"
  to = "/guide/start/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/rspeedy/start/*"
  to = "/zh/guide/start/:splat"
  status = 301
  force = true

# 4.1 is the last version with the complete Rspeedy documentation and
# carries the migration notice. Preserve the original page, query and hash
# instead of collapsing old references into build-guide sections. Use the
# public archive so these redirects work through the production /next proxy
# and from main or deploy previews, which do not host the 4.1 pages.
[[redirects]]
  from = "/rspeedy/*"
  to = "https://lynxjs.org/4.1/rspeedy/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/rspeedy/*"
  to = "https://lynxjs.org/4.1/zh/rspeedy/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/next/rspeedy/*"
  to = "https://lynxjs.org/4.1/rspeedy/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/next/zh/rspeedy/*"
  to = "https://lynxjs.org/4.1/zh/rspeedy/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/guide/compatibility*"
  to = "https://lynxjs.org/4.1/guide/compatibility.html"
  status = 301
  force = true

[[redirects]]
  from = "/zh/guide/compatibility*"
  to = "https://lynxjs.org/4.1/zh/guide/compatibility.html"
  status = 301
  force = true

[[redirects]]
  from = "/next/guide/compatibility*"
  to = "https://lynxjs.org/4.1/guide/compatibility.html"
  status = 301
  force = true

[[redirects]]
  from = "/next/zh/guide/compatibility*"
  to = "https://lynxjs.org/4.1/zh/guide/compatibility.html"
  status = 301
  force = true

[[redirects]]
  from = "/lynx-ui/start/*"
  to = "/guide/start/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/lynx-ui/start/*"
  to = "/zh/guide/start/:splat"
  status = 301
  force = true

# The lynx-ui subsite moved from /lynx-ui to /ui (client-side counterparts
# live in rspress.config.ts). These must stay below the /lynx-ui/start/*
# rules above so historical quick-start URLs keep landing on /guide/start/*,
# and need explicit /next/ variants because the /next/* rewrite at the
# bottom doesn't chain into other rules.
[[redirects]]
  from = "/lynx-ui/*"
  to = "/ui/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/lynx-ui/*"
  to = "/zh/ui/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/next/lynx-ui/*"
  to = "/next/ui/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/next/zh/lynx-ui/*"
  to = "/next/zh/ui/:splat"
  status = 301
  force = true

# Preserve the route name used by each historical release. lynx-ui shipped at
# /lynx-ui in 3.8 and at /ui in 3.9; these aliases keep links version-local
# instead of falling through to the current unversioned documentation.
[[redirects]]
  from = "/3.8/ui"
  to = "/3.8/lynx-ui/"
  status = 301
  force = true

[[redirects]]
  from = "/3.8/ui/*"
  to = "/3.8/lynx-ui/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/3.8/zh/ui"
  to = "/3.8/zh/lynx-ui/"
  status = 301
  force = true

[[redirects]]
  from = "/3.8/zh/ui/*"
  to = "/3.8/zh/lynx-ui/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/3.9/lynx-ui"
  to = "/3.9/ui/"
  status = 301
  force = true

[[redirects]]
  from = "/3.9/lynx-ui/*"
  to = "/3.9/ui/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/3.9/zh/lynx-ui"
  to = "/3.9/zh/ui/"
  status = 301
  force = true

[[redirects]]
  from = "/3.9/zh/lynx-ui/*"
  to = "/3.9/zh/ui/:splat"
  status = 301
  force = true


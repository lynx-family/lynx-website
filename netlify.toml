  status = 301
  force = true

# Preserve the route name used by each historical release. lynx-ui shipped at
# /lynx-ui in 3.8 and at /ui in 3.9; these aliases keep links version-local
# instead of falling through to the current unversioned documentation.
[[redirects]]
  from = "/3.8/ui"
  to = "/3.8/lynx-ui/"
  status = 301
  force = true

[[redirects]]
  from = "/3.8/ui/*"
  to = "/3.8/lynx-ui/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/3.8/zh/ui"
  to = "/3.8/zh/lynx-ui/"
  status = 301
  force = true

[[redirects]]
  from = "/3.8/zh/ui/*"
  to = "/3.8/zh/lynx-ui/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/3.9/lynx-ui"
  to = "/3.9/ui/"
  status = 301
  force = true

[[redirects]]
  from = "/3.9/lynx-ui/*"
  to = "/3.9/ui/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/3.9/zh/lynx-ui"
  to = "/3.9/zh/ui/"
  status = 301
  force = true

[[redirects]]
  from = "/3.9/zh/lynx-ui/*"
  to = "/3.9/zh/ui/:splat"
  status = 301
  force = true

# Serve everything under /next/ from the site root.
[[redirects]]
  from = "/next/*"
  to = "/:splat"
  status = 200

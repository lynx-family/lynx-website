<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three Horizons from open capabilities to a shared ecosystem</title>
  <desc id="desc">A Roadmap moving from left to right. Now closes the official capability loop. Next brings standards and validation into a public loop. Exploring lets shared standards grow across frameworks into an open ecosystem.</desc>
  <defs>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Inter, "SF Pro Text", "Segoe UI", ui-sans-serif, sans-serif; fill: #0f172a; }
      .title { font-size: 28px; font-weight: 750; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 1.3px; }
      .stage-name { font-size: 12px; font-weight: 800; letter-spacing: 1.2px; }
      .stage-title { font-size: 20px; font-weight: 750; }
      .card-flow { font-size: 11px; font-weight: 800; letter-spacing: 0.25px; }
      .card-title { font-size: 16px; font-weight: 750; }
      .card-copy { font-size: 12px; fill: #475569; }
      .chip { font-size: 11px; font-weight: 700; }
      .axis-label { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 0.8px; }
      .note { font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="672" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="60" y="68" class="title">From Open Capabilities to a Shared Ecosystem</text>
  <text x="60" y="95" class="subtitle">The Roadmap tracks the open radius of the feedback system—not component count</text>

  <text x="60" y="132" class="eyebrow" fill="#2563eb">FEEDBACK SYSTEM · OPEN RADIUS</text>
  <path d="M 300 128 H 1116" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Timeline and connectors -->
  <path d="M 72 366 H 1128" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-end)"/>
  <path d="M 72 366 H 250" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M 326 366 H 600" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <path d="M 676 366 H 950" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round"/>

  <path d="M 250 214 V 282" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M 600 450 V 504" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M 950 234 V 282" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- NOW card -->
  <rect x="84" y="150" width="332" height="150" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="84" y="150" width="332" height="34" rx="16" fill="#dbeafe"/>
  <path d="M 84 168 Q 84 150 102 150 H 398 Q 416 150 416 168 V 184 H 84 Z" fill="#dbeafe"/>
  <text x="104" y="172" class="card-flow" fill="#1d4ed8">OPEN CODE → DEPENDABLE CAPABILITY</text>
  <text x="104" y="212" class="card-title">Close the Official Capability Loop</text>
  <text x="104" y="237" class="card-copy">Production capability + Element API + lynx-ui</text>
  <text x="104" y="258" class="card-copy">Platform behavior · Docs · Tests · Migration</text>
  <rect x="104" y="272" width="266" height="20" rx="10" fill="#eff6ff"/>
  <text x="237" y="286" text-anchor="middle" class="chip" fill="#1d4ed8">Dependable: support · fallback · upgrade cost</text>

  <!-- NEXT card -->
  <rect x="434" y="488" width="332" height="158" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="434" y="488" width="332" height="34" rx="16" fill="#ede9fe"/>
  <path d="M 434 506 Q 434 488 452 488 H 748 Q 766 488 766 506 V 522 H 434 Z" fill="#ede9fe"/>
  <text x="454" y="510" class="card-flow" fill="#6d28d9">OFFICIAL WORK → SHARED STANDARD</text>
  <text x="454" y="550" class="card-title">Open Standards and Validation</text>
  <text x="454" y="575" class="card-copy">RFCs / Discussions shape semantics and behavior</text>
  <text x="454" y="596" class="card-copy">Shared tests · Quality baseline · Manifest</text>
  <rect x="454" y="610" width="268" height="20" rx="10" fill="#f5f3ff"/>
  <text x="588" y="624" text-anchor="middle" class="chip" fill="#6d28d9">Shared: public standard · long-term ownership</text>

  <!-- EXPLORING card -->
  <rect x="784" y="130" width="332" height="170" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="784" y="130" width="332" height="34" rx="16" fill="#dcfce7"/>
  <path d="M 784 148 Q 784 130 802 130 H 1098 Q 1116 130 1116 148 V 164 H 784 Z" fill="#dcfce7"/>
  <text x="804" y="152" class="card-flow" fill="#047857">SHARED STANDARD → GROWING ECOSYSTEM</text>
  <text x="804" y="192" class="card-title">Grow the Loop Across Frameworks</text>
  <text x="804" y="217" class="card-copy">More DSLs · Distribution · Shared behavior</text>
  <text x="804" y="238" class="card-copy">Industry UI · Design systems · Tools / Agents</text>
  <rect x="804" y="254" width="258" height="20" rx="10" fill="#f0fdf4"/>
  <text x="933" y="268" text-anchor="middle" class="chip" fill="#047857">Growing: no restart from platform differences</text>

  <!-- Stage nodes -->
  <circle cx="250" cy="366" r="82" fill="#f8fafc" stroke="#cbd5e1" stroke-width="8"/>
  <circle cx="250" cy="366" r="82" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-dasharray="258 258" transform="rotate(-90 250 366)"/>
  <circle cx="250" cy="284" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="250" cy="448" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="250" y="345" text-anchor="middle" class="stage-name" fill="#2563eb">NOW</text>
  <text x="250" y="375" text-anchor="middle" class="stage-title">Capability</text>
  <text x="250" y="401" text-anchor="middle" class="stage-title">Loop Closed</text>

  <circle cx="600" cy="366" r="82" fill="#f8fafc" stroke="#cbd5e1" stroke-width="8"/>
  <circle cx="600" cy="366" r="82" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" stroke-dasharray="258 258" transform="rotate(90 600 366)"/>
  <circle cx="600" cy="284" r="7" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="600" cy="448" r="7" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="600" y="345" text-anchor="middle" class="stage-name" fill="#7c3aed">NEXT</text>
  <text x="600" y="375" text-anchor="middle" class="stage-title">Public</text>
  <text x="600" y="401" text-anchor="middle" class="stage-title">Standards Loop</text>

  <circle cx="950" cy="366" r="82" fill="#f8fafc" stroke="#cbd5e1" stroke-width="8"/>
  <circle cx="950" cy="366" r="82" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-dasharray="258 258" transform="rotate(-90 950 366)"/>
  <circle cx="950" cy="284" r="7" fill="#ffffff" stroke="#059669" stroke-width="3"/>
  <circle cx="950" cy="448" r="7" fill="#ffffff" stroke="#059669" stroke-width="3"/>
  <text x="950" y="345" text-anchor="middle" class="stage-name" fill="#059669">EXPLORING</text>
  <text x="950" y="375" text-anchor="middle" class="stage-title">Cross-DSL</text>
  <text x="950" y="401" text-anchor="middle" class="stage-title">Growth</text>

  <text x="72" y="398" class="axis-label">OPEN CODE</text>
  <text x="1128" y="474" text-anchor="end" class="axis-label">PUBLIC UI INFRASTRUCTURE</text>

  <rect x="342" y="668" width="516" height="24" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="600" y="684" text-anchor="middle" class="note">Three Horizons—not delivery commitments tied to fixed dates</text>
</svg>

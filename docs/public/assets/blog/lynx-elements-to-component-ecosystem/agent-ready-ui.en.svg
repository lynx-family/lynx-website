<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">From Agent Intent to Trustworthy Cross-platform UI</title>
  <desc id="desc">Agent intent moves through constrained UI expression, component interaction semantics, the Element contract, XElement native capabilities, and Lynx Engine execution, with executable evaluation feeding the public contract.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-blue-small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple-small" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, "SF Pro Text", "Segoe UI", ui-sans-serif, sans-serif; fill: #0f172a; }
      .title { font-size: 31px; font-weight: 760; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .eyebrow { font-size: 11px; font-weight: 760; letter-spacing: 0.8px; fill: #475569; }
      .card-title { font-size: 18px; font-weight: 720; }
      .card-subtitle { font-size: 12px; fill: #475569; }
      .flow-label { font-size: 11px; font-weight: 680; fill: #475569; }
      .evaluation-title { font-size: 20px; font-weight: 740; }
      .formula { font-size: 13px; font-weight: 720; fill: #4c1d95; }
      .legend { font-size: 11px; fill: #64748b; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="672" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="64" class="title" text-anchor="start">From Agent Intent to Trustworthy Cross-platform UI</text>
  <text x="60" y="91" class="subtitle" text-anchor="start">Intent becomes dependable UI through constrained vocabulary, trusted semantics, and executable evaluation</text>
  <path d="M 580 187 H 650" fill="none" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
  <text x="615" y="174" class="flow-label" text-anchor="middle">intent</text>
  <path d="M 800 258 V 284 H 250 V 320" fill="none" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
  <text x="520" y="276" class="flow-label" text-anchor="middle">validated UI IR</text>
  <path d="M 185 242 V 320" fill="none" stroke="#ea580c" stroke-width="2.8" marker-end="url(#arrow-orange)"/>
  <text x="198" y="282" class="flow-label" text-anchor="start">visual semantics</text>
  <path d="M 300 385 H 335" fill="none" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
  <path d="M 585 385 H 620" fill="none" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
  <path d="M 870 385 H 905" fill="none" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
  <path d="M 1030 450 V 520" fill="none" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
  <text x="1044" y="486" class="flow-label" text-anchor="start">execute &amp; verify</text>
  <path d="M 1020 570 H 1160 V 282 H 1080 V 258" fill="none" stroke="#7c3aed" stroke-width="3.4" marker-end="url(#arrow-purple)"/>
  <text x="1146" y="300" class="flow-label" text-anchor="end">evaluation feedback</text>
  <rect x="60" y="132" width="250" height="110" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <rect x="80" y="150" width="28" height="28" rx="9" fill="#ea580c" opacity="0.14"/>
  <circle cx="94" cy="164" r="5" fill="#ea580c"/>
  <text x="120" y="161" class="eyebrow" text-anchor="start">LUNA</text>
  <text x="80" y="198" class="card-title" text-anchor="start">Visual Semantics</text>
  <text x="80" y="223" class="card-subtitle" text-anchor="start">Tokens · Appearance · Design System</text>
  <rect x="350" y="132" width="230" height="110" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="370" y="150" width="28" height="28" rx="9" fill="#f59e0b" opacity="0.14"/>
  <circle cx="384" cy="164" r="5" fill="#f59e0b"/>
  <text x="410" y="161" class="eyebrow" text-anchor="start">USER / AGENT</text>
  <text x="370" y="198" class="card-title" text-anchor="start">Intent &amp; Plan</text>
  <text x="370" y="223" class="card-subtitle" text-anchor="start">Goals · Constraints · Actions</text>
  <rect x="650" y="116" width="490" height="142" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="670" y="134" width="28" height="28" rx="9" fill="#7c3aed" opacity="0.14"/>
  <circle cx="684" cy="148" r="5" fill="#7c3aed"/>
  <text x="710" y="145" class="eyebrow" text-anchor="start">CONSTRAINED EXPRESSION</text>
  <text x="670" y="182" class="card-title" text-anchor="start">OpenUI / Component Manifest</text>
  <text x="670" y="207" class="card-subtitle" text-anchor="start">Constrained UI IR · Composition rules · Machine-readable contract</text>
  <rect x="50" y="320" width="250" height="130" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <rect x="70" y="338" width="28" height="28" rx="9" fill="#059669" opacity="0.14"/>
  <circle cx="84" cy="352" r="5" fill="#059669"/>
  <text x="110" y="349" class="eyebrow" text-anchor="start">INTERACTION</text>
  <text x="70" y="386" class="card-title" text-anchor="start">lynx-ui / Other DSLs</text>
  <text x="70" y="411" class="card-subtitle" text-anchor="start">Interaction semantics · State</text>
  <text x="70" y="429" class="card-subtitle" text-anchor="start">Composable behavior</text>
  <rect x="335" y="320" width="250" height="130" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="355" y="338" width="28" height="28" rx="9" fill="#7c3aed" opacity="0.14"/>
  <circle cx="369" cy="352" r="5" fill="#7c3aed"/>
  <text x="395" y="349" class="eyebrow" text-anchor="start">CONTRACT</text>
  <text x="355" y="386" class="card-title" text-anchor="start">Element</text>
  <text x="355" y="411" class="card-subtitle" text-anchor="start">API · Behavior · Compatibility</text>
  <text x="355" y="429" class="card-subtitle" text-anchor="start">Shared tests</text>
  <rect x="620" y="320" width="250" height="130" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="640" y="338" width="28" height="28" rx="9" fill="#2563eb" opacity="0.14"/>
  <circle cx="654" cy="352" r="5" fill="#2563eb"/>
  <text x="680" y="349" class="eyebrow" text-anchor="start">CAPABILITY</text>
  <text x="640" y="386" class="card-title" text-anchor="start">XElement</text>
  <text x="640" y="411" class="card-subtitle" text-anchor="start">Native capability · Platforms</text>
  <text x="640" y="429" class="card-subtitle" text-anchor="start">Performance</text>
  <rect x="905" y="320" width="250" height="130" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="925" y="338" width="28" height="28" rx="9" fill="#1d4ed8" opacity="0.14"/>
  <circle cx="939" cy="352" r="5" fill="#1d4ed8"/>
  <text x="965" y="349" class="eyebrow" text-anchor="start">RUNTIME</text>
  <text x="925" y="386" class="card-title" text-anchor="start">Lynx Engine</text>
  <text x="925" y="411" class="card-subtitle" text-anchor="start">Cross-platform rendering</text>
  <text x="925" y="429" class="card-subtitle" text-anchor="start">and execution</text>
  <rect x="180" y="520" width="840" height="104" rx="20" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="210" y="548" class="eyebrow" text-anchor="start">EXECUTABLE EVALUATION</text>
  <text x="210" y="578" class="evaluation-title" text-anchor="start">Compile · Run · Interact · Visual Evaluation</text>
  <text x="210" y="603" class="card-subtitle" text-anchor="start">Results refine the vocabulary, contracts, and capability boundaries</text>
  <rect x="675" y="544" width="100" height="26" rx="13" fill="#ede9fe"/>
  <text x="725.0" y="562" class="flow-label" text-anchor="middle">Composition gaps</text>
  <rect x="785" y="544" width="100" height="26" rx="13" fill="#ede9fe"/>
  <text x="835.0" y="562" class="flow-label" text-anchor="middle">Contract data</text>
  <rect x="895" y="544" width="100" height="26" rx="13" fill="#ede9fe"/>
  <text x="945.0" y="562" class="flow-label" text-anchor="middle">Capability gaps</text>
  <rect x="250" y="644" width="700" height="34" rx="17" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="600" y="666" class="formula" text-anchor="middle">Agent-ready UI = Constrained Expression × Trusted Semantics × Executable Evaluation</text>
  <line x1="420" y1="688" x2="452" y2="688" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue-small)"/>
  <text x="462" y="692" class="legend" text-anchor="start">trusted execution path</text>
  <line x1="650" y1="688" x2="682" y2="688" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple-small)"/>
  <text x="692" y="692" class="legend" text-anchor="start">open feedback loop</text>
</svg>

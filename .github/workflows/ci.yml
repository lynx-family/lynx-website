name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - 'release/[3-9].*'
      - 'release/[1-9][0-9].*'

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Case Check
        run: node scripts/ci/check-case-collisions.mjs

      - name: Asset URL Check
        run: node scripts/ci/check-asset-urls.mjs

      - name: lynx-ui Route Contract Check
        run: node scripts/ci/check-lynx-ui-routes.mjs

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm run format:check

      - name: Lynx Compat Data Test
        run: pnpm --filter @lynx-js/lynx-compat-data run test

      - name: Lynx Compat Data Pack Check
        run: pnpm --filter @lynx-js/lynx-compat-data run pack:check

      - name: Build
        run: pnpm run build

  done:
    name: Done
    needs:
      - validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Fail If Any Job Did Not Succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

name: Lynx Stack Docs Ownership

# These pages are generated and reviewed in lynx-stack (docs/content) and
# copied here by scripts/sync-lynx-stack-docs.mjs. Edits made here are
# overwritten by the next sync, so they are rejected up front. A PR that
# changes the sync itself may update them.

on:
  pull_request:
    paths:
      - 'docs/*/config/**'
      - 'docs/*/react/api/**'
      - 'docs/*/packages/**'

permissions: {}

jobs:
  check:
    name: Edited pages synced from lynx-stack
    if: github.head_ref != 'bot/update-api-docs'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if grep -qxE 'scripts/(sync-lynx-stack-docs\.mjs|lynx-stack-docs-dirs\.txt)' <<<"$files"; then
            echo "This PR changes the sync itself, so it may update the synced pages."
            exit 0
          fi
          echo "::error::This PR changes pages that are synced from lynx-stack."
          echo "Edit them in https://github.com/lynx-family/lynx-stack/tree/main/docs/content instead;"
          echo "the daily 'Update API docs' workflow copies them here."
          exit 1

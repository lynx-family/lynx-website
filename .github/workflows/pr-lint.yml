name: PR Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  # Allow `amannn/action-semantic-pull-request` to read pull requests.
  pull-requests: read

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Detect Repository-specific PR Title
        id: title-format
        env:
          # Authenticate `gh api`; the CLI reads this variable automatically.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          base_ref="$(jq -er '.base.ref' <<< "$pr_json")"
          pr_title="$(jq -er '.title' <<< "$pr_json")"
          pr_author_type="$(jq -er '.user.type' <<< "$pr_json")"
          head_ref="$(jq -er '.head.ref' <<< "$pr_json")"
          head_repo="$(jq -er '.head.repo.full_name // ""' <<< "$pr_json")"
          use_semantic_lint=true
          subject_pattern='(?=(?:\s*\S){3}).+'
          subject_pattern_error='The subject "{subject}" must contain at least 3 non-whitespace characters.'
          max_subject_length=72

          # These repository-supported formats are not Conventional Commit titles.
          if [[ "$pr_title" =~ ^Revert\ \"(.*)\"$ ]]; then
            revert_subject="${BASH_REMATCH[1]}"
            if [[ "$revert_subject" =~ [^[:space:]] ]]; then
              use_semantic_lint=false
            else
              echo "::error::Revert titles must include a non-whitespace subject."
              exit 1
            fi
          elif [[ "$base_ref" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
            release_prefix="[$base_ref] "
            if [[ "$pr_title" == "$release_prefix"* ]]; then
              backport_subject="${pr_title#"$release_prefix"}"
              if [[ "$backport_subject" =~ [^[:space:]] ]]; then
                use_semantic_lint=false
              else
                echo "::error::Backport titles must include a non-whitespace subject."
                exit 1
              fi
            fi
          fi

          # Renovate includes exact package names and versions in dependency PR
          # titles. Keep semantic validation, but allow those generated subjects
          # to exceed the normal human-authored title limit.
          if [[ "$pr_author_type" == "Bot" &&
            "$head_ref" == renovate/* &&
            "$head_repo" == "$GITHUB_REPOSITORY" ]]; then
            max_subject_length=128
          fi

          {
            echo "use-semantic-lint=$use_semantic_lint"
            echo "max-subject-length=$max_subject_length"
            echo "subject-pattern=$subject_pattern"
            echo "subject-pattern-error=$subject_pattern_error"
          } >> "$GITHUB_OUTPUT"

      # https://github.com/amannn/action-semantic-pull-request
      - name: Validate PR Title Format and Minimum Subject Content
        if: steps.title-format.outputs.use-semantic-lint == 'true'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Derived from https://github.com/commitizen/conventional-commit-types.
          types: |
            fix
            feat
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            release
            security
          # Scope patterns are automatically wrapped in `^` and `$`.
          scopes: |
            [a-z0-9]+(?:-[a-z0-9]+)*
          requireScope: false
          subjectPattern: ${{ steps.title-format.outputs.subject-pattern }}
          subjectPatternError: ${{ steps.title-format.outputs.subject-pattern-error }}

      - name: Validate PR Title Subject Length
        if: steps.title-format.outputs.use-semantic-lint == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_SUBJECT_LENGTH: ${{ steps.title-format.outputs.max-subject-length }}
        run: |
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          pr_title="$(jq -er '.title' <<< "$pr_json")"
          pr_subject="$pr_title"
          if [[ "$pr_title" =~ ^[^:]+:[[:space:]](.*)$ ]]; then
            pr_subject="${BASH_REMATCH[1]}"
          fi

          subject_length="${#pr_subject}"
          if (( subject_length > MAX_SUBJECT_LENGTH )); then
            echo "::error title=Pull request title is too long::The subject must be no longer than ${MAX_SUBJECT_LENGTH} characters; received ${subject_length}."
            exit 1
          fi

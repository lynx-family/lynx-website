name: Cherry-pick Config Check

on:
  pull_request:
    paths:
      - '.github/cherry-pick-config.json'
      - '.github/ISSUE_TEMPLATE/cherry_pick_request.yml'
      - '.github/scripts/cherry-pick-request.mjs'
      - '.github/scripts/cherry-pick-request.test.mjs'
      - '.github/workflows/cherry-pick-request.yml'
      - '.github/workflows/cherry-pick-config-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Test cherry-pick request workflow
        run: node --test .github/scripts/cherry-pick-request.test.mjs
      - name: Check cherry-pick configuration
        run: node .github/scripts/cherry-pick-request.mjs check-config

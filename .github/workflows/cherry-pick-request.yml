name: Cherry-pick Request

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: cherry-pick-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ contains(github.event.issue.labels.*.name, 'cherry-pick:request') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      should_execute: ${{ steps.validate.outputs.should_execute }}
      request_fingerprint: ${{ steps.validate.outputs.request_fingerprint }}
      source_pr: ${{ steps.validate.outputs.source_pr }}
      target_branches: ${{ steps.validate.outputs.target_branches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
      - id: validate
        run: node .github/scripts/cherry-pick-request.mjs validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  execute:
    needs: validate
    if: ${{ needs.validate.outputs.should_execute == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The execute script pushes generated cherry-pick branches to origin.
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
      - run: node .github/scripts/cherry-pick-request.mjs execute
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

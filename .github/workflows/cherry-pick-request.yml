name: Cherry-pick Request

on:
  issues:
    types: [edited, reopened, labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: cherry-pick-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Request
    if: ${{ contains(github.event.issue.labels.*.name, 'cherry-pick:request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      should_execute: ${{ steps.validate.outputs.should_execute }}
      request_fingerprint: ${{ steps.validate.outputs.request_fingerprint }}
      source_pr: ${{ steps.validate.outputs.source_pr }}
      target_branches: ${{ steps.validate.outputs.target_branches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
      - id: validate
        run: node .github/scripts/cherry-pick-request.mjs validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  execute:
    name: Execute Cherry-picks
    needs: validate
    if: ${{ needs.validate.outputs.should_execute == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The execute script pushes generated cherry-pick branches to origin.
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
      - run: node .github/scripts/cherry-pick-request.mjs execute
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Recover Failed Execution
    needs: [validate, execute]
    if: >-
      ${{
        always() &&
        (
          (
            needs.validate.result != 'success' &&
            needs.validate.result != 'skipped'
          ) ||
          (
            needs.validate.outputs.should_execute == 'true' &&
            needs.execute.result != 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Recover Request State
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path =
              '.github/scripts/cherry-pick-request-recovery.mjs';
            const { owner, repo } = context.repo;
            const { data: file } = await github.rest.repos.getContent({
              owner,
              repo,
              path,
              ref: context.sha,
            });
            if (
              Array.isArray(file) ||
              file.type !== 'file' ||
              file.encoding !== 'base64' ||
              !file.content
            ) {
              throw new Error(`Unable to load ${path} at ${context.sha}.`);
            }
            const source = file.content.replace(/\s/g, '');
            const recoveryModule = await import(
              `data:text/javascript;base64,${source}`
            );
            await recoveryModule.default({
              github,
              context,
              core,
            });
